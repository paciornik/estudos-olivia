<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cidade dos Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* plano: cidade de blocos sob céu claro; barra fixa no topo; palco central de 760px; botões "tijolo" com sombra dura */
  --sky:#bfe8ff;--sky2:#eaf8ff;--grass:#5cc86f;--grass2:#3a9f52;
  --ink:#1b2847;--soft:#54607e;--card:#ffffff;--line:#d9e3f3;
  --sun:#ffc531;--sun2:#e49b00;--coral:#ff6654;--coral2:#d9432f;
  --grape:#7458f5;--grape2:#5237cf;--mint:#17b3a3;--ok:#1fa85a;--bad:#e5484d;
  --fd:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --fb:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--fb);font-weight:500;font-size:18px;line-height:1.45;color:var(--ink);
  background:linear-gradient(var(--sky),var(--sky2) 55%,#f4fff0) fixed;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3{font-family:var(--fd);font-weight:800;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,5vw,2.4rem)}h2{font-size:1.4rem}h3{font-size:1.1rem}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.wrap,#app{max-width:760px;margin:0 auto;padding:0 16px}
#app{padding-bottom:64px}

/* ---------- botões ---------- */
.btn{border:0;border-radius:14px;background:var(--card);padding:10px 16px;font-weight:900;
  box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.big{background:var(--grape);color:#fff;box-shadow:0 5px 0 var(--grape2);padding:14px 22px;font-size:1.1rem;min-width:180px}
.btn.big:active{box-shadow:0 1px 0 var(--grape2)}
.btn.big:disabled{background:#c3c9da;box-shadow:0 5px 0 #a4abc0;cursor:not-allowed}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{font-size:.9rem;padding:8px 12px}
.btn.on{background:#fff3c9}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}

/* ---------- barra do topo ---------- */
#hud{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
#hud .in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-weight:900;background:#fff7dd;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.st{background:#efeaff}
#cloudwarn{position:fixed;left:0;right:0;top:0;z-index:60;background:#ffd7d7;color:#7a0d14;padding:10px 16px;font-weight:700;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}#cloudwarn.soft{background:#fff3c9;color:#5a4300}#cloudwarn.soft button{background:#5a4300}#cloudwarn button{margin-left:8px;border:0;border-radius:10px;padding:6px 12px;font-weight:900;background:#7a0d14;color:#fff}.pill.cl{padding:5px 8px;background:#eef2fb}.pill.rb{background:#dff8ee;color:#0d6b4c}
.pill .c{display:inline-block;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
#hud .sp{flex:1}
.ib{border:0;background:#f1f5fc;border-radius:12px;width:42px;height:42px;font-size:1.25rem;display:grid;place-items:center}
.ib:active{transform:scale(.94)}
.homeb{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:8px 12px;font-weight:900}

/* ---------- cidade ---------- */
.hero{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:20px 0 6px}
.eyebrow{font-weight:900;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--grape2)}
.lead{color:var(--soft);max-width:46ch;margin-top:6px}
.nextexam{background:var(--ink);color:#fff;border-radius:16px;padding:10px 14px;font-weight:700;line-height:1.2}
.nextexam b{display:block;font-family:var(--fd);font-size:1.3rem;color:var(--sun)}
.townwrap{position:relative;height:430px;overflow:hidden;margin:4px -16px 0}
.town{position:absolute;left:50%;top:0;width:560px;height:430px;margin-left:-280px;transform-origin:top center}
.plane{position:absolute;left:50%;top:56%;width:340px;height:340px;margin:-170px 0 0 -170px;
  transform:rotateX(58deg) rotateZ(45deg);transform-style:preserve-3d;
  background:linear-gradient(90deg,transparent 100px,#e6dcc3 100px 120px,transparent 120px 220px,#e6dcc3 220px 240px,transparent 240px),
             linear-gradient(transparent 100px,#e6dcc3 100px 120px,transparent 120px 220px,#e6dcc3 220px 240px,transparent 240px),var(--grass);
  border-radius:14px;box-shadow:14px 14px 0 var(--grass2),30px 30px 40px rgba(27,40,71,.25)}
.bld{position:absolute;width:100px;height:100px;transform-style:preserve-3d;cursor:pointer;transition:transform .2s;outline-offset:6px}
.bld:hover,.bld:focus-visible{transform:translateZ(10px)}
.bld i{position:absolute;display:block}
.bld .top{inset:0;transform:translateZ(var(--h));background:var(--c);border-radius:6px;box-shadow:inset 0 0 0 5px rgba(255,255,255,.35)}
.bld .s1{left:0;bottom:0;width:100%;height:var(--h);transform-origin:bottom;transform:rotateX(-90deg);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 12px,transparent 12px 25px) 6px 12px/100% 14px no-repeat,var(--c);filter:brightness(.82)}
.bld .s2{right:0;top:0;width:var(--h);height:100%;transform-origin:right;transform:rotateY(90deg);
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 12px,transparent 12px 25px) 12px 6px/14px 100% no-repeat,var(--c);filter:brightness(.64)}
.bld.off{--c:#aeb7c9 !important}
.tag{position:absolute;left:50%;top:50%;width:0;height:0;transform:translateZ(calc(var(--h) + 34px)) rotateZ(-45deg) rotateX(-58deg);pointer-events:none}
.tag span{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;background:#fff;border-radius:99px;padding:4px 12px;font-weight:900;font-size:15px;
  box-shadow:0 3px 0 rgba(27,40,71,.18);animation:bob 2.6s ease-in-out infinite}
.tag.me span{background:transparent;box-shadow:none;font-size:34px;padding:0;animation-duration:1.1s}
.bld:nth-child(2n) .tag span{animation-delay:.7s}
@keyframes bob{50%{transform:translate(-50%,-62%)}}
.lb2{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0}
.lb2 span{display:block;background:#fff;border-radius:99px;padding:3px 10px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(27,40,71,.2);animation:bob3 2.6s ease-in-out infinite}
.lb2:nth-child(2n) span{animation-delay:.8s}
.lb2.me{pointer-events:none}.lb2.me span{background:none;box-shadow:none;font-size:32px;padding:0;animation-duration:1.1s}.lb2.me i{font-style:normal}
@keyframes bob3{50%{transform:translateY(-5px)}}
body.inplay #hud .ib,body.inplay #hud .sp{display:none}
.pond{position:absolute;left:252px;top:258px;width:70px;height:56px;border-radius:50%;background:#62c6f7;box-shadow:inset 0 0 0 5px #bfe9ff}
.cloud{position:absolute;top:18px;left:-120px;width:110px;height:34px;border-radius:99px;background:#fff;opacity:.9;animation:drift 38s linear infinite}
.cloud::before{content:"";position:absolute;left:22px;top:-16px;width:50px;height:40px;border-radius:50%;background:#fff}
.cloud.b{top:70px;animation-duration:52s;animation-delay:-20s;transform:scale(.7)}
@keyframes drift{to{left:110%}}

.rbx{background:#0f5132;color:#fff;border-radius:20px;padding:14px 16px;margin:8px 0 18px;display:grid;gap:8px}
.rbx h2{font-size:1.2rem}.rbx small{opacity:.85}
.meter{height:16px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#7df0b5,#fff36b);border-radius:99px;transition:width .6s}
.subs{display:grid;gap:12px}
.sub{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:0;background:var(--card);border-radius:18px;padding:14px;border-left:10px solid var(--c);box-shadow:0 4px 0 var(--line);width:100%}
.sub:active{transform:translateY(2px)}
.sub .e{font-size:2rem}.sub b{font-family:var(--fd);font-size:1.2rem;display:block;line-height:1.1}
.sub small{color:var(--soft);font-weight:700}
.badge{border-radius:99px;padding:4px 10px;font-weight:900;font-size:.8rem;background:#eef2fb;white-space:nowrap}
.badge.hot{background:var(--coral);color:#fff}.badge.done{background:#dff8ee;color:#0d6b4c}
.sub.off{opacity:.65}
.mini{height:8px;background:#eef2fb;border-radius:99px;overflow:hidden;margin-top:6px}.mini i{display:block;height:100%;background:var(--c)}

/* ---------- prédio / lista de missões ---------- */
.page{padding-top:18px;display:grid;gap:14px}
.page.narrow{max-width:420px;margin:0 auto}
.shead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.shead .e{font-size:3rem;line-height:1}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border-radius:14px;padding:8px 12px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.stat small{display:block;font-weight:700;color:var(--soft);font-size:.75rem}
.ms{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line)}
.ms .n{width:46px;height:46px;border-radius:14px;background:var(--c,var(--grape));color:#fff;display:grid;place-items:center;font-size:1.4rem}
.ms b{font-family:var(--fd);font-size:1.1rem;line-height:1.15;display:block}
.ms small{color:var(--soft);font-weight:700}
.ms .st3{color:#d5dbe9;letter-spacing:2px;font-size:1.1rem}.ms .st3 b{display:inline;color:var(--sun2);font-size:inherit}
.ms .acts{display:flex;gap:6px;flex-direction:column;align-items:stretch}
.ms.quizc{background:#fff3c9;border:2px solid var(--sun2)}.ms.quizc .n{background:var(--sun2)}
.ms.boss{background:var(--ink);color:#fff}.ms.boss small{color:#c9d2ea}.ms.boss .n{background:var(--coral);font-size:1.7rem}

/* ---------- dicas ---------- */
.pbar{display:flex;gap:10px;align-items:center;padding:12px 0;flex-wrap:wrap}
.x{border:0;background:#fff;border-radius:12px;width:40px;height:40px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.track{flex:1;height:14px;background:#fff;border-radius:99px;overflow:hidden;min-width:120px}
.track i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.combo{font-weight:900;opacity:.35}.combo.on{opacity:1;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.dots{display:flex;gap:6px;flex:1}.dots i{flex:1;height:8px;border-radius:99px;background:#fff}.dots i.on{background:var(--grape)}
.lcard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 6px 0 var(--line);animation:pop .35s}
@keyframes pop{from{transform:scale(.94) rotate(-1deg);opacity:.4}}
.lcard .big{font-size:4rem;line-height:1;animation:bob2 2s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-6px)}}
.kind{display:inline-block;margin:10px 0 6px;border-radius:99px;padding:2px 12px;font-weight:900;font-size:.8rem;background:#efeaff;color:var(--grape2)}
.lb{margin-top:10px;font-size:1.08rem;max-width:60ch}
.ltools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ---------- jogo ---------- */
.stage{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 6px 0 var(--line);display:grid;gap:14px}
.q{font-size:1.3rem}
.opts{display:grid;gap:10px}.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;text-align:left;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opts.two .opt{text-align:center;font-weight:900}
.opt:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok,.bucket.ok,.pc.ok,.hw.ok{background:#dff8ee;border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.bad,.bucket.bad,.hw.bad{background:#ffe5e5;border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.passage{background:#fffaea;border:2px dashed #ecd9a0;border-radius:16px;padding:10px 14px}
.passage summary{font-weight:900;cursor:pointer}
.passage div{max-height:36vh;overflow:auto;margin-top:8px;font-size:1rem}
.count{color:var(--soft);font-weight:900;text-align:center}
.sortcard{background:var(--sun);border-radius:20px;padding:26px 16px;text-align:center;font-family:var(--fd);font-weight:800;font-size:1.5rem;line-height:1.15;box-shadow:0 6px 0 var(--sun2);animation:pop .25s}
.sortcard.fly{transition:transform .35s,opacity .35s;transform:translateY(60px) scale(.5);opacity:0}
.buckets{display:grid;gap:10px;grid-template-columns:1fr 1fr}.buckets.n3{grid-template-columns:1fr 1fr 1fr}
.bucket{border:2px solid var(--line);background:#f4f7fd;border-radius:16px;padding:16px 8px;font-weight:900;box-shadow:0 4px 0 var(--line);min-height:68px}
.bucket.hint{outline:4px solid var(--ok)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.slots{margin:0;padding-left:28px;display:grid;gap:6px;min-height:40px;font-weight:900}
.slots li{background:#dff8ee;border-radius:12px;padding:8px 12px;animation:pop .25s}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-weight:900;box-shadow:0 4px 0 var(--line);text-align:left}
.chip.gone{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pairs>div{display:grid;gap:8px;align-content:start}
.pc{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:700;font-size:.95rem;box-shadow:0 3px 0 var(--line);min-height:56px}
.pc.l{font-weight:900}.pc.sel{border-color:var(--grape);background:#efeaff}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;perspective:800px}
.mem.n3{grid-template-columns:repeat(3,1fr)}
.mc{border:0;background:none;padding:0;aspect-ratio:1/1}
.mc .in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .4s}
.mc.up .in{transform:rotateY(180deg)}
.mc .bk,.mc .ft{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;font-weight:900;padding:4px;text-align:center;line-height:1.1}
.mc .bk{background:var(--grape);color:#fff;font-size:1.6rem;box-shadow:0 4px 0 var(--grape2)}
.mc .ft{background:#fff;border:2px solid var(--line);transform:rotateY(180deg);font-size:clamp(.72rem,2.6vw,1rem);overflow:hidden}
.mc .ft.emo{font-size:2rem}
.mc.ok .ft{background:#dff8ee;border-color:var(--ok)}
.typebox{display:grid;gap:10px}
input[type=text],input[type=password],input[type=number],textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
#ti{font-size:1.5rem;font-weight:900;text-align:center}
input.ok{border-color:var(--ok);background:#dff8ee}input.bad{border-color:var(--bad);background:#ffe5e5}
.acc{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ak{border:0;border-radius:10px;background:#eef2fb;width:40px;height:40px;font-weight:900}
.hunt{display:flex;flex-wrap:wrap;gap:8px;font-size:1.25rem}
.hw{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.hw.sel{background:#fff3c9;border-color:var(--sun2)}
.model{background:#f1fbf6;border-radius:16px;padding:14px;display:grid;gap:10px;animation:pop .3s}
.kws span{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:900;font-size:.85rem;background:#eef2fb;margin:2px 0}
.kws span.ok{background:#dff8ee;color:#0d6b4c}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.write{display:grid;gap:8px}.write label{font-weight:900;margin-top:6px}
.checks{list-style:none;margin:6px 0;padding:0;display:grid;gap:4px;font-weight:700;color:var(--soft);font-size:.95rem}
.checks li.ok{color:var(--ok)}
.mytext{background:#fffaea;border-radius:14px;padding:14px;white-space:normal}
.selfcheck{display:grid;gap:8px}.selfcheck label{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.selfcheck input{width:24px;height:24px;flex:none}
[hidden]{display:none !important}
.how{color:var(--soft);font-weight:700;font-size:.9rem}
.sortcard,.swcard{cursor:grab;user-select:none;-webkit-user-select:none;position:relative;z-index:3}
.drag{cursor:grabbing !important;z-index:6 !important;box-shadow:0 14px 24px rgba(27,40,71,.28) !important}
.swcard{background:var(--sun);border-radius:20px;padding:26px 18px;text-align:center;font-family:var(--fd);font-weight:800;font-size:1.3rem;line-height:1.2;box-shadow:0 6px 0 var(--sun2)}
.opts.two .opt:first-child::before{content:"⬅ "}.opts.two .opt:last-child::after{content:" ➡"}
.gapq{line-height:1.7}
.blank{display:inline-block;min-width:90px;border:3px dashed var(--grape);border-radius:12px;padding:0 12px;text-align:center;color:var(--grape2);background:#efeaff}
.blank.ok{border-style:solid;border-color:var(--ok);background:#dff8ee;color:#0d6b4c}.blank.bad{border-style:solid;border-color:var(--bad);background:#ffe5e5;color:#a51f24}
.opts.gap{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opts.gap .opt{text-align:center;font-weight:900;font-size:1.2rem;min-width:96px;cursor:grab;user-select:none;-webkit-user-select:none;background:var(--sun);border-color:var(--sun2);box-shadow:0 4px 0 var(--sun2);position:relative}
.opts.gap .opt.ok{background:#dff8ee}.opts.gap .opt.bad{background:#ffe5e5}
.pairs{position:relative;column-gap:36px}
#ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
#ln line{stroke-width:5;stroke-linecap:round}#ln .tmp{stroke:var(--grape);stroke-dasharray:8 8}#ln .ok{stroke:var(--ok)}
.pc.l{cursor:grab;user-select:none;-webkit-user-select:none}
.arena{position:relative;height:340px;border-radius:18px;overflow:hidden;background:linear-gradient(#bfe8ff,#eaf8ff 76%,var(--grass) 76%);cursor:ew-resize;user-select:none;-webkit-user-select:none}
.basket{position:absolute;bottom:4px;font-size:3.2rem;line-height:1;transform:translateX(-50%);transition:left .06s linear}
.basket.yum{transform:translateX(-50%) scale(1.25)}
.fall{position:absolute;top:-40px;transform:translateX(-50%);background:#fff;border-radius:99px;padding:4px 12px;font-weight:900;white-space:nowrap;box-shadow:0 3px 0 rgba(27,40,71,.2)}
.ws{display:grid;gap:2px;user-select:none;-webkit-user-select:none;max-width:460px;margin:0 auto;width:100%}
.ws i{font-style:normal;aspect-ratio:1/1;display:grid;place-items:center;background:#f1f5fc;border-radius:6px;font-weight:900;font-size:clamp(.7rem,3.4vw,1.05rem)}
.ws i.s{background:var(--sun)}.ws i.f{background:#bff0d6;color:#0d6b4c}
.wl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.wl span{background:#eef2fb;border-radius:99px;padding:2px 10px;font-weight:900;font-size:.85rem}.wl span.f{background:#dff8ee;color:#0d6b4c;text-decoration:line-through}
.scr{position:relative;border-radius:18px;overflow:hidden;min-height:120px;background:#fffaea;border:2px dashed #ecd9a0;display:grid;place-items:center}
.scr .ans{padding:22px 16px;text-align:center;font-family:var(--fd);font-weight:800;font-size:1.4rem;line-height:1.2}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.micb.on{background:#ffe0e0}
.vis{display:grid;justify-items:center;gap:4px}
.sol3d{width:min(100%,300px);height:auto;cursor:grab;background:radial-gradient(#fff,#eaf3ff);border-radius:18px}
.net{width:min(100%,220px);height:auto}
.tray{min-height:92px;border:3px dashed var(--line);border-radius:18px;background:#f4f7fd;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.wallet{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bill,.coin{border:0;display:grid;place-items:center;align-content:center;gap:2px;line-height:1;font-weight:900;color:#fff;user-select:none;-webkit-user-select:none;cursor:grab;position:relative;box-shadow:0 4px 0 rgba(27,40,71,.25)}
.bill{width:96px;height:52px;border-radius:8px;background:var(--nc);outline:2px solid rgba(255,255,255,.55);outline-offset:-6px}
.bill b{font-size:1.35rem}.bill small,.coin small{font-size:.62rem;font-weight:700}
.coin{width:56px;height:56px;border-radius:50%;background:#b7bcc8;color:#1b2847;outline:2px solid rgba(255,255,255,.6);outline-offset:-5px}
.coin.one{background:radial-gradient(#d9dce3 52%,#e2b93b 54%)}.coin.au{background:#e2b93b}.coin.cu{background:#c7775a;color:#fff}
.bill.in{width:72px;height:40px}.bill.in b{font-size:1rem}.coin.in{width:44px;height:44px}.coin.in b{font-size:.9rem}
.opts.bal{display:flex;flex-wrap:wrap;justify-content:center;gap:30px 14px;padding:8px 0 28px}
.opts.bal .opt{width:136px;height:150px;border-radius:50% 50% 50% 50%/56% 56% 44% 44%;border:0;color:#fff;text-align:center;font-weight:900;display:grid;place-items:center;padding:14px;box-shadow:inset -10px -12px 0 rgba(0,0,0,.13);animation:float 3s ease-in-out infinite;position:relative;line-height:1.15;background:var(--coral)}
.opts.bal .opt::after{content:"";position:absolute;left:50%;bottom:-24px;width:2px;height:24px;background:#9aa3bd}
.opts.bal .opt:nth-child(2){background:var(--grape);animation-delay:-.8s}.opts.bal .opt:nth-child(3){background:var(--mint);animation-delay:-1.6s}.opts.bal .opt:nth-child(4){background:#2f7df6;animation-delay:-2.3s}
.opts.bal .opt.ok{background:var(--ok);box-shadow:inset -10px -12px 0 rgba(0,0,0,.13)}
.opts.bal .opt.bad{background:#9aa3bd;box-shadow:none;animation:popb .3s forwards}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes popb{to{transform:scale(.55);opacity:.5}}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px 16px calc(14px + env(safe-area-inset-bottom));animation:up .2s}
.fb.ok{background:#d6f5e4}.fb.bad{background:#ffe0e0}
.fbin{max-width:760px;margin:0 auto;display:grid;gap:8px}
.fbin strong{font-family:var(--fd);font-size:1.4rem}.fb.ok strong{color:#0d6b4c}.fb.bad strong{color:#a51f24}
.fbin .btn{justify-self:start}
@keyframes up{from{transform:translateY(100%)}}
.play{padding-bottom:190px}
.boss{display:flex;align-items:center;gap:10px;flex-basis:100%}
.mon{font-size:2.6rem;line-height:1;display:inline-block}.mon.hit{animation:shake .35s}
.hp{flex:1;height:16px;border-radius:99px;background:#fff;overflow:hidden}.hp i{display:block;height:100%;background:var(--coral);transition:width .3s}
.fuse{flex-basis:100%;height:6px;border-radius:99px;background:#fff;overflow:hidden}.fuse i{display:block;height:100%;width:100%;background:var(--sun2)}

/* ---------- resultado ---------- */
.result{text-align:center;padding-top:26px;display:grid;gap:12px;justify-items:center}
.chest{font-size:5rem;line-height:1;animation:chest 1s}
@keyframes chest{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.25) rotate(8deg)}}
.stars3{font-size:3.4rem;letter-spacing:6px;color:#d5dbe9;line-height:1}
.stars3 .on{color:var(--sun);display:inline-block;animation:starin .5s both;text-shadow:0 4px 0 var(--sun2)}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.loot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:900;font-size:1.2rem}
.loot span{background:#fff7dd;border-radius:99px;padding:6px 16px}.loot .r{background:#0f5132;color:#fff}
.hint{color:var(--soft);max-width:44ch}
.rev{text-align:left;background:var(--card);border-radius:16px;padding:12px 16px;width:100%}
.rev summary{font-weight:900;cursor:pointer}.rev li{margin:8px 0}

/* ---------- casa, caderno, pais ---------- */
.yard{position:relative;background:linear-gradient(var(--grass),var(--grass2));border-radius:24px;padding:20px 14px 26px;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;align-items:flex-end;min-height:190px;box-shadow:0 8px 0 #2c7f40}
.home{font-size:5.5rem;line-height:1;flex-basis:100%;text-align:center}
.yi,.me2{font-size:2.5rem;line-height:1;animation:bob2 2s ease-in-out infinite;animation-delay:calc(var(--n,0) * -.3s);filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.empty{flex-basis:100%;text-align:center;color:#fff;font-weight:900}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{border:0;background:var(--card);border-radius:16px;padding:12px 8px;display:grid;gap:2px;justify-items:center;box-shadow:0 4px 0 var(--line);text-align:center;line-height:1.15}
.item .ie{font-size:2.2rem}.item b{font-size:.9rem}.item .pr{font-weight:900;color:var(--sun2)}
.item.own{opacity:.55}.item.own .pr{color:var(--ok)}.item.sel{outline:4px solid var(--grape)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs .btn.on{background:var(--ink);color:#fff;box-shadow:0 4px 0 #000}
.note{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 4px 0 var(--line);display:grid;gap:6px}
.note .del{justify-self:start}
.note small{color:var(--soft);font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:.95rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.box{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 4px 0 var(--line);display:grid;gap:10px}
.frm{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.frm input{max-width:140px}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-weight:900;max-width:min(92vw,480px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.flyc{position:fixed;z-index:45;font-size:1.4rem;pointer-events:none}
.helpb{margin-top:10px}
.hbox{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 4px 0 var(--line);display:grid;gap:8px}
.hbox ul,.hbox ol{margin:0;padding-left:22px;display:grid;gap:6px}
.hbox.rbbox{background:#0f5132;color:#fff;box-shadow:0 4px 0 #0a3a24}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.hgrid div{background:#f4f7fd;border-radius:12px;padding:10px;display:grid;gap:2px}.hgrid span{font-size:.92rem;color:var(--soft)}
.help td{vertical-align:top}
@media (max-width:420px){body{font-size:17px}.q{font-size:1.18rem}.sortcard{font-size:1.25rem}.buckets.n3 .bucket{font-size:.85rem;padding:12px 4px}.pc{font-size:.85rem;padding:8px 6px}.homeb span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

texts:{d1:{title:'Página de diário',body:'Sábado, 14 de novembro de 2026.<br><br>Querido diário,<br><br>Hoje foi o dia mais maluco da semana! Acordei cedo porque era a festa da Luna, minha melhor amiga. Eu estava nervosa... será que ela ia gostar do presente que eu mesma fiz?<br><br>Quando ela abriu a caixa e viu a pulseira, deu um grito e me abraçou tão forte que quase caímos no chão! Depois brincamos de esconde-esconde e eu fiquei escondida atrás da cortina por um tempão.<br><br>Na hora do bolo, o irmãozinho dela enfiou o dedo na cobertura. Ninguém ficou bravo, todo mundo riu.<br><br>Voltei para casa cansada, mas muito feliz. Preciso guardar esse dia para sempre!<br><br>Boa noite, diário!'}},

/* ============ 4. MONOSSÍLABOS: A REGRA ============ */
{id:'p4',name:'O chapéu dos monossílabos',icon:'🎩',
cards:[
{e:'👏',t:'Regra',h:'Monossílabo = uma palma só',b:'Bata palmas para contar as sílabas: <b>pé</b> (1 palma), <b>mar</b> (1 palma), <b>ca-sa</b> (2 palmas).<br>Palavra de <b>uma sílaba só</b> é <b>monossílaba</b>.'},
{e:'💪',t:'Regra',h:'Tônico é o forte',b:'Monossílabo <b>tônico</b> é falado com força e tem sentido sozinho: <b>pé, chá, sol, mar, três</b>.<br>Monossílabo <b>átono</b> é fraquinho e se apoia em outra palavra: <b>de, me, se, o, a, que, com</b>. Átono nunca leva acento.'},
{e:'🎩',t:'Truque',h:'A regra A-E-O',b:'O monossílabo tônico ganha acento quando termina em <b>A, E, O</b> (pode ter S no fim):<br><b>pá, lá, cá, gás</b> · <b>pé, fé, três, mês</b> · <b>pó, só, nó, nós</b><br>Pense assim: A, E e O gostam de <b>chapéu</b>. As outras letras, não: <b>mar, flor, sol, mel, luz, dor, bom, vi, tu</b>.'},
{e:'🔍',t:'Dica',h:'Passo a passo na prova',b:'1. É uma sílaba só? 2. É forte (tônico)? 3. Termina em A, E, O (com ou sem S)?<br>Três vezes <b>sim</b> = coloque o acento!'}
],

/* ============ 5. ACENTO QUE MUDA O SENTIDO ============ */
{id:'p5',name:'O acento que muda tudo',icon:'🪄',
cards:[
{e:'🪄',t:'Truque',h:'Com acento é uma palavra, sem acento é outra',b:'<b>dá</b> (verbo dar) x <b>da</b> (de + a)<br><b>dê</b> (verbo dar) x <b>de</b><br><b>nós</b> (a gente) x <b>nos</b><br><b>más</b> (malvadas) x <b>mas</b> (porém)<br><b>é</b> (verbo ser) x <b>e</b> (junta coisas)'},
{e:'🧪',t:'Truque',h:'Testes rápidos',b:'Dá para trocar por <b>porém</b>? Então é <b>mas</b>, sem acento.<br>Dá para trocar por <b>a gente</b>? Então é <b>nós</b>, com acento.<br>Dá para trocar por <b>está</b> ou <b>era</b>? Então é <b>é</b>, com acento.<br>É alguém <b>entregando</b> algo? Então é <b>dá</b>, com acento.'},
{e:'💡',t:'Dica',h:'O forte ganha acento',b:'O com acento é o <b>tônico</b> (forte, com sentido próprio). O sem acento é o <b>átono</b> (fraquinho, só liga palavras). Leia a frase em voz alta e sinta qual é falado com força.'}
],

/* ============ 6. PRONOMES DEMONSTRATIVOS ============ */
{id:'p6',name:'Este, esse, aquele',icon:'👉',
cards:[
{e:'👉',t:'Regra',h:'Pronomes demonstrativos apontam',b:'Eles mostram <b>onde está</b> aquilo de que falamos:<br><b>este, esta, isto</b> → perto de <b>quem fala</b> (eu)<br><b>esse, essa, isso</b> → perto de <b>com quem se fala</b> (você)<br><b>aquele, aquela, aquilo</b> → <b>longe</b> dos dois'},
{e:'🎮',t:'Truque',h:'O truque T - S - L',b:'es<b>T</b>e = <b>T</b>á comigo, aqui na minha mão.<br>e<b>SS</b>e = tá aí com você: é <b>S</b>eu.<br>aque<b>L</b>e = tá <b>L</b>á longe.<br>No livro: "<i>Este</i> peixe aqui é pequeno. <i>Esse</i> peixe aí poderia ser maior. Mas <i>aquele</i> lá é bem grande!"'},
{e:'👗',t:'Regra',h:'Eles combinam com a palavra',b:'Um menino: <b>este</b> livro. Uma menina: <b>esta</b> mochila. Mais de um: <b>estes</b> livros, <b>estas</b> mochilas.<br><b>Isto, isso, aquilo</b> servem para coisas sem nome: "O que é <b>isso</b> aí na sua mão?"'},
{e:'🔁',t:'Dica',h:'Eles também evitam repetição',b:'O pronome pode <b>retomar</b> algo que já foi dito:<br>"A mandioca é uma planta importante. <b>Essa</b> raiz faz parte da cultura dos povos originários."<br>Aqui, <b>essa raiz</b> = a mandioca.'}
],

/* ============ 7. ELEMENTOS DA NARRATIVA ============ */
{id:'p7',name:'Os ingredientes da história',icon:'🧁',
cards:[
{e:'🎮',t:'Analogia',h:'Uma história é como um jogo',b:'<b>Narrador</b> = quem conta o que acontece.<br><b>Personagens</b> = os avatares: pessoas, animais ou seres mágicos que vivem a aventura.<br><b>Espaço</b> = o mapa: o lugar onde tudo acontece.<br><b>Tempo</b> = quando a história acontece.<br><b>Enredo</b> = as missões: o que acontece no começo, no meio e no fim.'},
{e:'🦊',t:'Regra',h:'Fábula',b:'É uma narrativa <b>curta</b>, com <b>animais que agem como gente</b> (falam, enganam, sentem vaidade), e traz um ensinamento: a <b>moral</b>. A moral pode vir escrita ou ficar escondida para a gente descobrir.'},
{e:'⏳',t:'Dica',h:'O tempo das fábulas',b:'"<b>Era uma vez...</b>", "<b>Um dia...</b>", "<b>Certa vez...</b>" são expressões de <b>tempo indeterminado</b>: não dizem a data certa. Por isso a lição da fábula vale para sempre.'},
{e:'🧀',t:'Exemplo',h:'Lembra destas fábulas do livro?',b:'<b>A raposa e o corvo</b>: a raposa esperta elogia o corvo vaidoso até ele abrir o bico e soltar o queijo. Lição: cuidado com quem elogia demais.<br><b>A cegonha e a raposa</b>: não faça aos outros o que não quer que façam com você.<br><b>O galo e a pérola</b>: o valor das coisas é diferente para cada um.'}
],
texts:{f1:{title:'O tucano e o caracol',body:'Certa manhã, na beira de um rio, um tucano muito orgulhoso ria de um caracol.<br>— Como você é lento! — disse o tucano. — Eu atravesso a floresta inteira antes de você sair do lugar.<br>O caracol respondeu com calma:<br>— Devagar eu também chego.<br>Naquela tarde, caiu uma chuva forte. O tucano, com pressa, voou sem olhar e bateu o bico num galho. Ficou preso, pedindo socorro.<br>O caracol, que vinha devagarinho, viu tudo. Foi chamar as formigas e, juntas, elas soltaram o tucano.<br>— Obrigado, amigo — disse o tucano, envergonhado. — Nunca mais vou rir de ninguém.<br><br><i>Moral: não despreze os outros; todo mundo tem seu valor.</i>'}},

{id:'p8',name:'Travessão em ação',icon:'💬',
cards:[
{e:'🎤',t:'Analogia',h:'O travessão é o microfone',b:'Quando a personagem vai falar, o narrador <b>abre a cortina</b> com <b>dois-pontos (:)</b> e entrega o <b>microfone</b>, que é o <b>travessão (—)</b>:<br><br>A raposa falou<b>:</b><br><b>—</b> Querido corvo, você me desculpa?'},
{e:'🔀',t:'Regra',h:'Discurso direto x indireto',b:'<b>Direto</b>: a fala aparece do jeitinho que a personagem disse, com dois-pontos e travessão.<br><i>E cumprimentou o corvo:<br>— Bom dia, mestre corvo!</i><br><br><b>Indireto</b>: o narrador <b>conta</b> o que ela disse, sem travessão.<br><i>Cumprimentou o corvo, dando-lhe bom-dia.</i>'},
{e:'📏',t:'Regra',h:'Regras de ouro do diálogo',b:'1. Cada fala começa em uma <b>linha nova</b>, com travessão.<br>2. A fala começa com <b>letra maiúscula</b>.<br>3. Use <b>?</b> para pergunta e <b>!</b> para emoção.<br>4. Mudou quem fala? Linha nova!'},
{e:'🗣️',t:'Dica',h:'Verbos de dizer',b:'Não use só "disse". Troque por <b>perguntou</b>, <b>respondeu</b>, <b>gritou</b>, <b>cochichou</b>, <b>exclamou</b>, <b>pediu</b>, <b>avisou</b>. Eles mostram <b>como</b> a personagem falou.'}
],

/* ============ 1. NOSSA CASA COMUM (cap. 8) ============ */
{id:'e1',name:'Nossa casa comum',icon:'🌍',
cards:[
{e:'🏡',t:'Analogia',h:'O planeta é uma casa gigante',b:'A Terra é a nossa <b>casa comum</b>: uma casa só, <b>compartilhada por todos os seres vivos</b>. Como em casa, se cada um cuida do seu cantinho, tudo fica bem. Se ninguém cuida, vira bagunça para todo mundo.'},
{e:'🎒',t:'Exemplo',h:'Começa na mochila',b:'Manter a <b>organização</b> facilita a vida: com a mochila arrumada, você acha o que precisa e conserva os objetos. Cuidar da casa e dos pertences é o primeiro passo. Depois, esse cuidado se <b>estende ao planeta</b>.'},
{e:'🤝',t:'Regra',h:'Responsabilidade de todos',b:'O <b>zelo pela natureza</b> é responsabilidade de <b>todos nós</b>. Fazemos parte dela e somos <b>agentes de mudança</b>. Somos <b>dependentes uns dos outros</b>: pessoas, animais e plantas.'},
{e:'♻️',t:'Truque',h:'Os 3 RE do livro',b:'Três formas de diminuir a destruição do planeta:<br><b>RE</b>duzir o <b>consumo</b> (comprar e gastar menos)<br><b>RE</b>aproveitar os <b>materiais</b><br><b>RE</b>utilizar os <b>objetos</b> do nosso uso<br>Truque: re<b>UTILIZAR</b> = <b>utilizar</b> de novo o objeto.'},
{e:'🌐',t:'Truque',h:'Ação local, pensamento global',b:'<b>Ação local</b> = o que eu faço <b>pertinho</b>: em casa, no bairro, na escola, na cidade.<br><b>Pensamento global</b> = se <b>todos</b> fizerem boas ações onde vivem, o <b>planeta inteiro</b> melhora.<br>É como um jogo em equipe: cada um faz a sua parte e o time todo ganha.'}
],

cards:[
{e:'📜',t:'Regra',h:'Laudato Si\'',b:'Em <b>2015</b>, o <b>papa Francisco</b>, líder da Igreja Católica, publicou o documento <b>Laudato Si\'</b>. O nome está em <b>latim</b> e significa "<b>Louvado seja!</b>". Ele convida as pessoas a cuidarem de <b>tudo o que Deus criou</b> e diz que, se todos se unirem, as coisas podem mudar.'},

{e:'🇸🇪',t:'Truque',h:'Estocolmo: 1972 e 2022',b:'Em <b>1972</b>, em <b>Estocolmo (Suécia)</b>, aconteceu a <b>primeira conferência</b> sobre ecologia e cuidado com o meio ambiente. Em <b>2022</b>, <b>50 anos</b> depois, líderes de mais de <b>130 países</b> voltaram lá para comemorar. Representantes de mais de <b>200 tradições religiosas</b> assinaram uma <b>declaração inter-religiosa</b> para proteger a Terra.<br>Conta rápida: 1972 + 50 = 2022.'},
{e:'🌳',t:'Exemplo',h:'São Paulo, 2022: Amazônia',b:'No <b>Encontro Inter-Religioso pela Preservação da Amazônia</b>, as tradições religiosas assinaram uma <b>carta aberta</b> aos candidatos políticos pedindo a preservação da <b>biodiversidade</b> e o direito dos <b>povos originários</b> de preservar suas tradições.'},

{e:'🧠',t:'Truque',h:'Truques para não confundir',b:'<b>U</b>nibes → j<b>u</b>daísmo (os dois têm U).<br>CE<b>BB</b> → <b>B</b>udismo (B de Buda).<br>Projeto <b>Islã</b> Solidário → <b>islamismo</b>.<br><b>Pastoral</b> da Criança → cristianismo <b>católico</b>.<br>Símbolos: ✝️ cruz (cristianismo) · ✡️ estrela de Davi (judaísmo) · ☸️ roda do Dharma (budismo) · ☪️ lua crescente e estrela (islamismo).'},

{e:'🚫',t:'Regra',h:'O que é bullying',b:'<b>Bullying</b> vem do <b>inglês</b> e quer dizer "<b>intimidação</b>". É uma <b>agressão física ou psicológica</b>, feita de forma <b>repetitiva</b>, por uma pessoa ou por um grupo, contra alguém que não consegue se defender. Pode acontecer por diferenças físicas ou por <b>preconceito religioso</b> (a roupa ou o jeito de celebrar a fé).'},
{e:'🔁',t:'Truque',h:'Brincadeira ou bullying?',b:'Teste das 3 perguntas:<br>1. <b>Todo mundo</b> está se divertindo?<br>2. Acontece <b>de novo e de novo</b> com a mesma pessoa?<br>3. Alguém fica <b>triste, com medo ou com vergonha</b>?<br>Se só um lado ri e isso se repete, <b>é bullying</b>.'},

{id:'c1',name:'Solo: o chão que alimenta',icon:'🌱',

{e:'🏠',t:'Analogia',h:'O solo é despensa, chão e filtro',b:'<b>Despensa</b>: é do solo que as plantas tiram água e nutrientes. Sem solo não teríamos plantas e, sem elas, não teríamos <b>alimentos</b> nem <b>gás oxigênio</b> para respirar.<br><b>Chão</b>: o solo é o lugar onde construímos <b>moradias</b>.<br><b>Filtro</b>: nele se decompõem algumas substâncias tóxicas. Por isso ele funciona como <b>purificador</b>.'},

{e:'☕',t:'Exemplo',h:'As duas fotos do livro',b:'<b>Plantação de soja</b>: técnica de <b>monocultura</b> (apenas um tipo).<br><b>Café e banana juntos</b>: técnica de <b>diversificação de culturas</b> (mais de um tipo).'}
],

/* ============ 4. SOS SOLO ============ */
{id:'c4',name:'SOS solo: erosão e queimadas',icon:'🌧️',
cards:[
{e:'🎂',t:'Analogia',h:'Solo sem planta é bolo sem forma',b:'<b>Erosão</b>: quando a <b>chuva forte</b> ou a água corrente bate no <b>solo descoberto</b>, partes do solo se espalham e são levadas para riachos, córregos e rios.<br>As <b>raízes</b> são como dedos que <b>seguram</b> a terra. <b>Galhos e folhas</b> caídos funcionam como um tapete: a água escorre <b>mais devagar</b>.<br>Solução: <b>plantar árvores ou gramíneas</b>.'},
{e:'⚠️',t:'Regra',h:'O que ameaça o solo',b:'As atividades humanas ameaçam o solo com <b>erosão, poluição e perda de nutrientes</b>:<br><b>Urbanização</b>: a cobertura vegetal é retirada para construir.<br><b>Agricultura intensiva</b>: como a monocultura.<br><b>Pecuária</b>: grande concentração de animais no mesmo lugar.'},
{e:'🔥',t:'Regra',h:'Queimadas e defensivos',b:'<b>Queimadas</b>: são usadas para limpar o solo e preparar o plantio, mas causam <b>perda de nutrientes</b> e <b>deterioram o ambiente</b>.<br><b>Defensivos agrícolas</b>: protegem a plantação de animais como <b>gafanhotos</b>. Usados do jeito errado ou <b>em excesso</b>, prejudicam o ambiente e os animais, <b>inclusive o ser humano</b>.'},
{e:'🧪',t:'Exemplo',h:'O experimento das 3 garrafas',b:'Garrafa 1: terra com <b>plantas</b> crescendo. Garrafa 2: terra coberta com <b>folhas, cascas e galhos</b>. Garrafa 3: <b>só terra</b>.<br>Ao despejar água: na garrafa com plantas a água sai <b>mais limpa</b>; na de terra pura sai <b>barrenta</b>, carregando o solo. Conclusão: a <b>cobertura vegetal protege o solo</b>.'},
{e:'♾️',t:'Truque',h:'Uso sustentável do solo',b:'É adotar práticas que <b>preservem e até melhorem</b> a qualidade do solo, garantindo sua <b>fertilidade</b> e sua capacidade de produzir por <b>muito tempo</b>.<br>Truque: <b>sustentável</b> = dá para <b>sustentar</b>, continuar sempre.'}
],

{e:'🛡️',t:'Regra',h:'4 atitudes para proteger os solos',b:'1. <b>Reduzir o consumo de produtos industrializados</b>: menos materiais <b>não biodegradáveis</b> jogados no ambiente.<br>2. <b>Separar o lixo e reciclar</b>: eletrônicos, como o celular, têm <b>substâncias tóxicas</b> que vazam para o solo e a água.<br>3. <b>Usar fertilizante orgânico</b>: recicla nutrientes <b>sem contaminar</b>.<br>4. <b>Não jogar lixo no chão</b>: o lixo contamina o solo e a água.'},
{e:'🏜️',t:'Dica',h:'Solos em risco',b:'Hoje os solos da Terra correm muitos riscos. Em locais mais <b>secos e quentes</b>, as <b>áreas de deserto estão aumentando</b>. <b>Pesticida</b> em excesso contamina o solo e mata os <b>microrganismos</b> que vivem nele.'},

/* ============ 2. CRIANÇA NÃO TRABALHA! (cap. 11) ============ */
{id:'h2',name:'Criança não trabalha!',icon:'🟥',
cards:[
{e:'⚽',t:'Armandinho',h:'"Ser criança" é um compromisso inadiável',b:'Na tirinha, Armandinho diz que não pode sair porque tem um <b>compromisso inadiável</b>: <b>ser criança!</b><br><b>Inadiável</b> = algo que <b>não pode ser deixado para depois</b>. A infância é agora: é hora de brincar, estudar e se desenvolver.'},
{e:'🏭',t:'Antes e agora',h:'No passado, crianças trabalhavam',b:'Durante muito tempo, as crianças eram vistas como <b>adultos pequenos</b>. Trabalhavam no <b>campo</b> (plantação, animais), na <b>cidade</b> (vendedores) e até como operários em <b>fábricas</b>.<br>Hoje sabemos que a infância é uma fase que precisa de <b>cuidado e atenção</b>. Nessa fase, crianças <b>não devem trabalhar</b>.'},
{e:'⚖️',t:'A regra da lei',h:'Quando se pode trabalhar?',b:'No Brasil, <b>nenhuma criança pode trabalhar</b>.<br>• A partir dos <b>14 anos</b>: só como <b>aprendiz</b> (trabalha e aprende uma profissão).<br>• A partir dos <b>18 anos</b>: pode trabalhar normalmente.<br>Dica: <b>14 = aprendiz</b>, <b>18 = trabalhador</b>.'},
{e:'💸',t:'Por quê?',h:'Por que ainda existe trabalho infantil?',b:'Principalmente pela <b>pobreza</b>: algumas crianças são forçadas a trabalhar para ajudar na <b>renda</b> da família.<br><b>Renda</b> = dinheiro que uma pessoa ou família recebe.<br>Também é trabalho infantil quando crianças pedem dinheiro na rua ou fazem <b>serviços domésticos</b> que deveriam ser feitos por adultos.<br>O trabalho infantil é uma <b>violação</b> (desrespeito a uma lei) dos direitos das crianças.'},
{e:'🏫',t:'Lugar de criança',h:'Lugar de criança é na escola',b:'O trabalho infantil prejudica a <b>saúde</b> e o <b>desenvolvimento</b>. A criança fica sem tempo para <b>estudar, brincar, praticar esportes e descansar</b>.<br>Segundo o ECA, é <b>dever de toda a sociedade</b> cuidar dos direitos das crianças e combater o trabalho infantil.'},
{e:'☎️',t:'Como ajudar',h:'Disque 100 e 12 de junho',b:'<b>Disque 100</b>: número criado em <b>2003</b> para denunciar violações dos direitos humanos, como o trabalho infantil. A ligação é <b>gratuita</b>, pode ser feita <b>a qualquer hora</b> e a pessoa <b>não precisa se identificar</b>.<br><b>12 de junho</b>: Dia Mundial contra o Trabalho Infantil.<br>Campanhas como o <b>Cartão vermelho ao trabalho infantil</b> conscientizam as pessoas. A <b>fiscalização</b> (vigiar com atenção) ajudou a diminuir os casos.'}
],

/* ============ 3. DESEMPREGO E ATIVIDADES ECONÔMICAS (cap. 11) ============ */
{id:'h3',name:'Trabalho, desemprego e economia',icon:'🏭',
cards:[
{e:'💼',t:'Ideia principal',h:'O que é desemprego?',b:'<b>Desemprego</b> é a situação de uma pessoa que <b>não está trabalhando no momento</b>, mesmo querendo trabalhar.<br>Ele acontece quando existem <b>mais pessoas procurando emprego</b> do que empregos disponíveis.'},
{e:'🌧️',t:'Causas',h:'Por que acontece o desemprego?',b:'Pode ter diferentes causas:<br>• <b>problemas econômicos</b>;<br>• <b>conflitos ou guerras</b>;<br>• <b>desastres naturais</b>;<br>• <b>mudanças tecnológicas</b> (quando máquinas passam a fazer o trabalho das pessoas).'},
{e:'🧩',t:'Analogia',h:'Desemprego é como peça de dominó caindo',b:'Quando alguém perde o emprego, a <b>renda</b> da família diminui. Isso afeta a <b>saúde física e mental</b>, o acesso aos itens necessários para uma <b>vida digna</b> e até as atividades econômicas da cidade (as pessoas compram menos). Uma peça derruba a outra!<br>Quando os adultos não têm renda, os direitos das crianças também podem ser violados.'},
{e:'🌽',t:'No campo',h:'Atividades econômicas do campo',b:'<b>Economia</b> = conjunto de atividades de <b>produção, distribuição e consumo</b> de mercadorias.<br>• <b>Agricultura</b>: produz alimentos como arroz, feijão, milho e frutas.<br>• <b>Pecuária</b>: criação de animais (leite, carne, ovos, lã).<br>• <b>Agroindústria</b>: transforma produtos agrícolas em alimentos prontos (sucos, queijos, doces).'},
{e:'🏙️',t:'Na cidade',h:'Atividades econômicas da cidade',b:'• <b>Comércio</b>: venda de produtos (restaurantes, farmácias, padarias, salões de beleza).<br>• <b>Indústria</b>: fábricas que produzem eletrodomésticos, carros e brinquedos. Existem indústrias nas cidades e também em áreas rurais.<br>• <b>Turismo</b>: hotéis, restaurantes e guias turísticos. Ajuda a economia tanto do campo quanto da cidade.'}
],

{e:'📢',t:'Propaganda',h:'A função da propaganda',b:'A função das <b>propagandas</b> é nos <b>incentivar a consumir</b>. Elas são feitas para <b>mexer com as nossas emoções</b> e nos convencer a comprar.<br>Na internet também há <b>influenciadores digitais</b> que divulgam produtos parecendo que é algo natural.<br>Armandinho: "Parece que tentam me convencer a querer o que eu não preciso!"'},
{e:'🎈',t:'Consumismo',h:'Quando consumir vira exagero',b:'<b>Consumismo</b> é consumir de forma <b>exagerada</b>, ultrapassando os <b>limites</b> do que precisamos.<br>Ele pode nos levar a acreditar que só seremos <b>felizes</b> se tivermos o que é famoso ou o que está na moda.<br>Às vezes a <b>diversão</b> vira <b>sinônimo</b> de consumismo (<b>sinônimo</b> = palavra de significado parecido).'},
{e:'🚫',t:'Você sabia?',h:'Propaganda para crianças é proibida',b:'No Brasil, é <b>proibido</b> fazer propagandas destinadas às crianças, porque elas despertam o desejo de consumo das crianças.<br>A <b>OMS</b> (Organização Mundial da Saúde) recomenda que crianças de até 10 anos <b>não usem o celular mais de duas horas por dia</b>, pois isso pode prejudicar a saúde.'},
{e:'🌎',t:'Consumo consciente',h:'Repensar antes de comprar',b:'O consumismo traz problemas para a vida <b>física, emocional e financeira</b> e para o <b>meio ambiente</b>: quanto mais consumimos, mais resíduos são gerados.<br><b>Consumo consciente</b> é repensar os hábitos e fazer escolhas <b>sustentáveis</b>.<br><b>Sustentável</b> = equilíbrio entre atender às necessidades das pessoas e explorar os recursos naturais, garantindo que existam para as <b>gerações futuras</b>.<br>Pergunta mágica antes de comprar: <b>"Eu preciso mesmo disso?"</b>'},
{e:'🍟',t:'Alimentação',h:'Ultraprocessados e sódio',b:'Nos espaços de lazer há muitos estímulos ao consumo de <b>alimentos industrializados e ultraprocessados</b>: passaram por processos para mudar sabor, forma e conservação e foram feitos com ingredientes industriais. Exemplo: <b>salgadinho de pacote</b>.<br>Eles são pouco nutritivos e têm muito <b>sódio</b> (mineral presente no sal). Em excesso, pode causar <b>doenças do coração e obesidade</b>.'}

/* ============ 6. PARA ONDE VAI O LIXO? (cap. 12) ============ */
{id:'h6',name:'Para onde vai o lixo?',icon:'🚛',
cards:[
{e:'🧻',t:'Ideia principal',h:'O que são resíduos?',b:'<b>Resíduos</b> são as <b>partes que sobram</b> de objetos, roupas, alimentos e até os <b>gases</b> liberados por fábricas e carros. Ou seja, de tudo o que é produzido e gera <b>poluição</b>. É o que chamamos de <b>"lixo"</b>.<br>Todas as atividades do município geram resíduos: <b>domésticos, industriais, hospitalares, agrícolas e tecnológicos</b>.'},
{e:'☠️',t:'Problema',h:'Descarte incorreto polui',b:'Quando os resíduos são jogados no lugar errado, em <b>ruas, estradas, terrenos baldios, rios, mares</b> ou liberados no <b>ar</b>, eles <b>poluem o meio ambiente</b>.<br>O Brasil é um dos países que mais produz resíduos no mundo.'},
{e:'🏔️',t:'Lixão',h:'Lixão a céu aberto (errado!)',b:'No Brasil ainda é comum que muitos resíduos sejam jogados em <b>lixões a céu aberto</b>, embora uma <b>lei proíba</b> esses locais.<br><b>Céu aberto</b> = em uma grande área aberta, <b>sem cobertura</b>. O lixo fica exposto e contamina o solo, a água e o ar.'},
{e:'🔥',t:'Incineração',h:'Queimar em fornos especiais',b:'<b>Incineração industrial</b>: os resíduos são colocados em <b>fornos específicos</b> e queimados. As <b>cinzas</b> são levadas para aterros sanitários.'},
{e:'🍰',t:'Analogia',h:'Aterro sanitário é como um bolo em camadas',b:'O <b>aterro sanitário</b> é considerado a técnica <b>mais correta</b>.<br>Os resíduos são colocados em <b>camadas alternadas com terra</b>, como um bolo de camadas, para que possam se <b>decompor</b> sem contaminar o meio ambiente. Tubos captam os <b>gases</b> do lixo.<br><b>Decompor</b> = separar-se em partes menores, se desfazer.'},
{e:'♻️',t:'Heróis',h:'Os catadores',b:'Os <b>catadores</b> são responsáveis pela coleta e pelo descarte correto de grande parte dos resíduos nos municípios brasileiros. São profissionais muito importantes!<br>Você sabia? No deserto do Atacama, no Chile, existe um <b>"cemitério de roupas"</b>, onde toneladas de roupas são descartadas de modo irregular. É o resultado do consumismo!'}
],

{id:'h7',name:'Cores da coleta seletiva',icon:'🗑️',
cards:[
{e:'🎨',t:'Truque para decorar',h:'As cores das lixeiras',b:'<b>Azul</b> = <b>papel</b> (o céu azul é como uma folha em branco)<br><b>Vermelho</b> = <b>plástico</b> (garrafa de refrigerante vermelha)<br><b>Amarelo</b> = <b>metal</b> (moeda dourada / latinha amarela)<br><b>Verde</b> = <b>vidro</b> (garrafa verde)<br><b>Marrom</b> = <b>orgânico</b> (restos de comida, cor de terra)<br>Frase mágica: <b>"Papel no céu, plástico no fogo, metal no ouro, vidro na garrafa, comida na terra."</b>'},
{e:'🧺',t:'Ideia principal',h:'O que é coleta seletiva?',b:'<b>Coleta seletiva</b> é uma forma de colaborar para diminuir os impactos negativos no meio ambiente. É o processo de <b>separação dos resíduos sólidos secos</b> de acordo com o material: <b>papel, plástico, metal e vidro</b>. Também é comum a coleta de <b>resíduos orgânicos</b>.<br>Pode ser feita em espaços <b>públicos e privados</b> e ajuda nas etapas da reciclagem.'},
{e:'🔄',t:'Analogia',h:'Reciclagem é dar uma nova vida',b:'<b>Reciclagem</b> é o processo em que um objeto descartado se transforma em <b>outro produto</b> ou em <b>matéria-prima</b>.<br><b>Matéria-prima</b> = substância ou elemento principal usado na fabricação de um produto.<br>Exemplo: a garrafa PET vira fio para fazer camiseta! Com a reciclagem, a quantidade de lixo produzido no município diminui.'},
{e:'🏥',t:'Tipos de resíduo',h:'Resíduos pela origem',b:'• <b>Industrial</b>: gerado na fabricação de produtos (metal, borracha, plástico).<br>• <b>Hospitalar</b>: de hospitais, como seringas, agulhas, curativos e medicamentos. Pode ser <b>tóxico e contaminante</b>.<br>• <b>Eletrônico</b>: computadores, celulares, pilhas e baterias.<br>• <b>Verde</b>: da poda de plantas e árvores (galhos, grama, folhas).<br>• <b>Agrícola</b>: da agricultura e pecuária (sobras de rações, embalagens, fertilizantes).'},
{e:'📍',t:'Ecoponto',h:'Onde levar o que não vai no lixo comum',b:'<b>Ecoponto</b> = lugar que recebe <b>resíduos recicláveis</b> para o descarte correto.<br>Resíduos podem ser separados em: <b>orgânicos</b>, <b>recicláveis</b> e <b>especiais</b> (como pilhas, baterias, eletrônicos, esponjas e marcadores de texto).'}

/* ============ 8. OS 5 Rs E REVISÃO (cap. 11 e 12) ============ */
{id:'h8',name:'Os 5 Rs e a Teia do Conhecimento',icon:'🌱',

/* ============ 5. O DINHEIRO DO BRASIL ============ */
{id:'m5',name:'O dinheiro do Brasil',icon:'🪙',
cards:[
{e:'🌳',t:'Curiosidade',h:'Antes do real',b:'Antigamente, no Brasil, as pessoas <b>trocavam mercadorias</b> (o pau-brasil era a principal). Entre <b>1630 e 1654</b> surgiram as primeiras moedas feitas aqui: os <b>florins</b> e os <b>soldos</b>. Em <b>1694</b> foi criada a primeira <b>Casa da Moeda</b>, na <b>Bahia</b>. Tivemos cruzeiro, cruzado e cruzeiro real. Em <b>1994</b> surgiu o <b>real</b>.'},
{e:'💵',t:'Regra',h:'Sistema monetário',b:'<b>Sistema monetário</b> é o conjunto de <b>moedas e cédulas</b> em circulação em um país, que serve como <b>meio de pagamento</b> e <b>medida de valor</b>. O nosso dinheiro é o <b>real</b>, e o símbolo é <b>R$</b>.'},
{e:'🐢',t:'Truque',h:'O zoológico das cédulas',b:'Cada cédula tem um animal da fauna brasileira:<br><b>2</b> tartaruga marinha · <b>5</b> garça · <b>10</b> arara · <b>20</b> mico-leão-dourado · <b>50</b> onça-pintada · <b>100</b> garoupa · <b>200</b> lobo-guará<br>Na frente de todas está a <b>efígie da República</b> (o rosto de mulher, inspirado em Marianne).'},
{e:'🪙',t:'Regra',h:'Moedas: cara e coroa',b:'<b>Cara</b> = lado do rosto ou símbolo. <b>Coroa</b> = lado que mostra o <b>valor</b>.<br>Moedas: <b>1 real</b> (a de maior valor), <b>50, 25, 10 e 5 centavos</b>. A de 1 centavo não é mais fabricada. Na coroa de todas aparece o <b>Cruzeiro do Sul</b>, uma constelação.'},
{e:'💯',t:'Truque',h:'1 real = 100 centavos',b:'<b>CENT</b>avo lembra <b>CEM</b>: cabem 100 centavos em 1 real.<br>Para formar 1 real: <b>2</b> moedas de 50 · <b>4</b> de 25 · <b>10</b> de 10 · <b>20</b> de 5.'}

{e:'💳',t:'Regra',h:'4 formas de pagar',b:'<b>Dinheiro</b>: cédulas e moedas, direto.<br><b>Cartão</b>: de <b>débito</b> (o dinheiro sai na hora da conta) ou de <b>crédito</b> (o pagamento é feito depois).<br><b>PIX</b>: pelo celular, rápido; o dinheiro sai na hora.<br><b>Boleto</b>: papel com <b>código de barras</b>, usado para pagar contas.'},

function normS(x){x=Object.assign(def(),x||{});x.cfg=Object.assign(def().cfg,x.cfg||{});
 if(x.spent==null||isNaN(x.spent)){let sp=0;(x.owned||[]).forEach(id=>{const i=SHOP.find(z=>z.id===id);if(i)sp+=i.p;});(x.skins||[]).forEach(e=>{const k=SKINS.find(z=>z[0]===e);if(k)sp+=k[1];});x.spent=sp;}
 x.coins=Math.max(0,(x.earned||0)-(x.spent||0));return x;}

function merge(a,b){a=normS(a);b=normS(b);if((a.epoch||0)!==(b.epoch||0))return (a.epoch||0)>(b.epoch||0)?a:b;
 const base=(b.ts||0)>(a.ts||0)?b:a,o=base===a?b:a,m=normS(JSON.parse(JSON.stringify(base)));
 m.stars=Object.assign({},o.stars,base.stars);for(const k in o.stars||{})m.stars[k]=Math.max(m.stars[k]||0,o.stars[k]);
 m.got=Object.assign({},o.got,base.got);m.hour=Object.assign({},o.hour,base.hour);
 m.time=Object.assign({},base.time);for(const k in o.time||{})m.time[k]=Math.max(m.time[k]||0,o.time[k]);
 const uni=(x,y,f)=>{const s=new Set((x||[]).map(f));return (x||[]).concat((y||[]).filter(i=>!s.has(f(i))));};
 m.notes=uni(base.notes,o.notes,i=>i.id);m.texts=uni(base.texts,o.texts,i=>i.id).slice(0,40);m.wrong=uni(base.wrong,o.wrong,i=>i.q).slice(0,60);
 m.owned=[...new Set([...(base.owned||[]),...(o.owned||[])])];m.skins=[...new Set([...(base.skins||[]),...(o.skins||[])])];
 m.seenHelp=base.seenHelp||o.seenHelp;m.logSent=Object.assign({},o.logSent,base.logSent);m.log=uni(base.log,o.log,i=>i.id).sort((x,y)=>x.at-y.at).slice(-300);m.seenAt=Math.max(base.seenAt||0,o.seenAt||0);m.grants=Object.assign({},o.grants,base.grants);
 m.earned=Math.max(base.earned||0,o.earned||0);m.spent=Math.max(base.spent||0,o.spent||0);m.coins=Math.max(0,m.earned-m.spent);
 m.cfg=Object.assign({},((o.cfg&&o.cfg.t)||0)>((base.cfg&&base.cfg.t)||0)?o.cfg:base.cfg);return m;}
const Cloud={ref:null,busy:false,dirty:false,t:null,on:false,last:0,sent:0,unsub:null,
 async init(){if(SHEET){if(!PIN)return;return this.sheetInit();}try{if(!window.claude||!window.claude.use){banner();return;}const db=await window.claude.use('db');if(!db){banner();return;}
   this.ref=db.doc('game/olivia');const snap=await this.ref.get();
   if(snap.exists){const d=snap.data();if(d&&d.json){S=merge(S,JSON.parse(d.json));localSave();refresh();}}
   this.on=true;hud();this.dirty=true;await this.flush();
   this.unsub=this.ref.onSnapshot(sn=>{try{if(!sn.exists||sn.metadata.hasPendingWrites)return;const d=sn.data();if(!d||!d.json||d.ts===this.sent)return;
     S=merge(S,JSON.parse(d.json));localSave();refresh();}catch(e){}},()=>{});}catch(e){this.ref=null;this.on=false;hud();banner();}},
 async sheetInit(){this.ref='sheet';try{const r=await sheetCall({acao:'entrar',pin:PIN});if(!r.ok){if(r.erro==='pin'){logout(true);return;}throw r;}
   setNome(r.nome);if(r.estado)S=merge(S,r.estado);this.known=r.versao||0;localSave();this.on=true;this.fails=0;refresh();banner();this.dirty=true;await this.flush();}
  catch(e){this.on=false;this.fails=(this.fails||0)+1;hud();banner();setTimeout(()=>{if(!this.on)this.sheetInit();},20000);}},
 async pull(){if(!SHEET||!PIN||this.busy)return;try{const r=await sheetCall({acao:'entrar',pin:PIN});if(r.ok){this.on=true;this.fails=0;if(r.versao!==this.known&&r.estado){S=merge(S,r.estado);this.known=r.versao;localSave();if(NAV.cur.s!=='play'&&NAV.cur.s!=='lesson')refresh();else hud();}}}catch(e){}banner();},
 async sheetFlush(){const novos=(S.log||[]).filter(l=>!(S.logSent||{})[l.id]);S.logSent=S.logSent||{};novos.forEach(l=>{S.logSent[l.id]=1;});
   try{for(let k=0;k<3;k++){const r=await sheetCall({acao:'salvar',pin:PIN,conhecida:this.known||0,estado:slim(),resumo:sheetResumo(),novos:k?[]:novos.map(histRow)});
      if(r.ok){this.known=r.versao;this.on=true;this.fails=0;this.last=Date.now();localSave();return;}
      if(r.conflito){S=merge(S,r.estado||{});this.known=r.versao;localSave();if(NAV.cur.s!=='play'&&NAV.cur.s!=='lesson')refresh();continue;}
      if(r.erro==='pin'){logout(true);return;}throw r;}
     throw {code:'conflito'};}
   catch(e){novos.forEach(l=>{delete S.logSent[l.id];});throw e;}},
 retry(){if(this.ref||this.tries>=6)return;this.tries=(this.tries||0)+1;this.init();},
 now(){if(!this.ref)return;clearTimeout(this.t);this.t=null;this.dirty=true;this.flush();},
 push(){if(!this.ref)return;this.dirty=true;if(this.t)return;this.t=setTimeout(()=>{this.t=null;this.flush();},SHEET?4000:2500);},

   if(SHEET){try{await this.sheetFlush();}catch(e){this.fails=(this.fails||0)+1;this.dirty=true;this.on=false;setTimeout(()=>this.push(),20000);}this.busy=false;hud();banner();if(this.dirty&&this.on)this.push();return;}
   try{const sn=await this.ref.get();if(sn.exists){const d=sn.data();if(d&&d.json&&d.ts!==this.sent){S=merge(S,JSON.parse(d.json));localSave();}}
     this.sent=S.ts;const L=(S.log||[]).slice(-1)[0];await this.ref.set({json:JSON.stringify(S),ts:S.ts,stars:totalStars(),robux:robux(),minutos:mins(),moedas:S.coins,agora:S.live?`${S.live.nome} (${S.live.sub}) pergunta ${S.live.pos} de ${S.live.total}`:'',ultima:L?`${L.nome} (${L.sub}) ${L.res} ${L.pct}% ${L.stars}★ ${L.min}min`:''});this.last=Date.now();this.on=true;this.fails=0;banner();}
   catch(e){this.fails=(this.fails||0)+1;this.dirty=true;if(!(e&&e.code==='unavailable'))this.on=false;banner();setTimeout(()=>this.push(),15000);}
   this.busy=false;hud();if(this.dirty)this.push();}};

 if(tab==='dicas')body=S.notes.length?S.notes.map(n=>`<div class="note"><small>${(SUBJ.find(s=>s.id===n.sub)||{}).name||''}</small><h3>${n.e} ${n.h}</h3><div>${n.b}</div><button class="btn sm del" data-act="delnote:${n.id}">Tirar do caderno</button></div>`).join(''):'<p class="lead">Nenhuma dica guardada ainda. Nas missões, toque em “📌 Guardar no caderno” nas dicas que você quer rever antes da prova.</p>';
 if(tab==='textos')body=S.texts.length?S.texts.map(t=>`<div class="note"><small>${t.k==='texto'?'Meu texto':'Minha resposta'}</small><h3>${esc(t.t)}</h3><div>${esc(t.b).replace(/\n/g,'<br>')}</div><button class="btn sm del" data-act="deltext:${t.id}">Apagar</button></div>`).join(''):'<p class="lead">Os textos e respostas que você escrever nas missões ficam guardados aqui.</p>';
 if(tab==='erros')body=S.wrong.length?S.wrong.map(w=>`<div class="note"><small>${(SUBJ.find(s=>s.id===w.sub)||{}).name||''}</small><div>${esc(w.q)}</div><b>✓ ${esc(w.a)}</b></div>`).join('')+'<button class="btn sm" data-act="clearwrong">Limpar esta lista</button>':'<p class="lead">O que você errar nas missões aparece aqui com a resposta certa, para revisar antes da prova.</p>';
 app.innerHTML=`<div class="page"><h1>Meu caderno</h1><div class="tabs">${[['dicas','📌 Dicas ('+S.notes.length+')'],['textos','✍️ Meus textos ('+S.texts.length+')'],['erros','🔁 Errei e aprendi ('+S.wrong.length+')']].map(t=>`<button class="btn sm ${tab===t[0]?'on':''}" data-act="book:${t[0]}">${t[1]}</button>`).join('')}</div>${body}</div>`;}

/* ---------- guia: como jogar ---------- */
function help(){NAV.cur={s:'help'};R=null;if(!S.seenHelp){S.seenHelp=1;save();}
 const pl=SUBJ.map(s=>`<tr><td>${s.e} ${s.place}</td><td>${s.name}</td><td class="n">${dlabel(s.date)}</td></tr>`).join('');
 app.innerHTML=`<div class="page help"><p class="eyebrow">Guia da cidade</p><h1>Como jogar 🎮</h1>
 <p class="lead">Oi, ${esc(NOME||'Olívia')}! Aqui você estuda para as provas jogando. Cada acerto vale moedas, e cada estrela vale Robux de verdade. Leia este guia uma vez e depois é só jogar!</p>

 <div class="hbox"><h2>🏙️ 1. A cidade</h2><p>Cada prédio é uma matéria. Toque no prédio (ou na lista embaixo da cidade) para entrar.</p>
 <div class="tw"><table><thead><tr><th>Prédio</th><th>Matéria</th><th class="n">Prova</th></tr></thead><tbody>${pl}</tbody></table></div>
 <p>🚧 quer dizer que o prédio ainda está em construção.</p></div>

 <div class="hbox"><h2>🧭 2. A barra lá em cima</h2><ul>
 <li><b>🏙️ Cidade</b>: volta para a tela inicial.</li><li><b>🪙 Moedas</b>: você ganha acertando.</li><li><b>⭐ Estrelas</b>: você ganha terminando missões.</li><li><b>⬡ Robux</b>: quantos Robux você já conquistou.</li>
 <li><b>🏠</b> sua casa e a loja · <b>📒</b> seu caderno · <b>❓</b> este guia · <b>🔊</b> liga e desliga o som · <b>🔒</b> área dos pais (precisa de senha).</li></ul></div>

 <div class="hbox"><h2>🗺️ 3. Dentro do prédio</h2><p>Cada prédio tem várias <b>missões</b>. Cada missão leva uns 10 a 15 minutos.</p><ul>
 <li><b>Jogar</b>: começa a missão.</li><li><b>Dicas</b>: só lê as explicações, sem jogar.</li>
 <li><b>Chefão</b> 👾: fica trancado 🔒 até você terminar 5 missões daquele prédio.</li></ul></div>

 <div class="hbox"><h2>🎯 4. Como é uma missão</h2><ol>
 <li><b>Cartões de dica</b>: leia com calma. São truques e jeitos fáceis de lembrar. Gostou de uma? Toque em <b>📌 Guardar no caderno</b>.</li>
 <li><b>Desafios</b>: cada tela é um jogo diferente (veja a lista abaixo).</li>
 <li><b>Errou?</b> Sem problema! Aparece a resposta certa e a explicação. Aquela pergunta volta no fim para você tentar de novo.</li>
 <li><b>Baú do final</b> 🎁: mostra suas estrelas, suas moedas e o que você errou.</li></ol>
 <p>Para sair no meio, toque no <b>✕ duas vezes</b>. Mas cuidado: quem sai antes do fim não ganha as estrelas daquela rodada.</p></div>

 <div class="hbox"><h2>🕹️ 5. Os tipos de desafio</h2><div class="hgrid">
 <div><b>📦 Caixas</b><span>Arraste a carta amarela até a caixa certa.</span></div>
 <div><b>↔️ Deslizar</b><span>Arraste a carta para a esquerda (Falso) ou para a direita (Verdadeiro).</span></div>
 <div><b>🧩 Lacuna</b><span>Arraste a palavra certa até o espaço com <b>?</b> na frase.</span></div>
 <div><b>🔗 Ligar pares</b><span>Puxe uma linha do quadro da esquerda até o par dele, na direita.</span></div>
 <div><b>🧺 Cesta</b><span>Mova a cesta com o dedo. Pegue só os certos e desvie dos errados!</span></div>
 <div><b>🔤 Caça-palavras</b><span>Arraste o dedo sobre as letras da palavra, deitada ou em pé.</span></div>
 <div><b>✨ Raspadinha</b><span>Responda em voz alta, raspe o cartão e diga se acertou. Seja honesta!</span></div>
 <div><b>🎈 Balões</b><span>Estoure o balão com a resposta certa.</span></div>
 <div><b>🃏 Memória</b><span>Vire duas cartas e ache os pares.</span></div>
 <div><b>🔢 Ordem</b><span>Toque nos itens na ordem certa, do primeiro ao último.</span></div>
 <div><b>⌨️ Digitar</b><span>Escreva a resposta e toque em Conferir. Às vezes tem 💡 um truque escondido.</span></div>
 <div><b>🧊 Sólidos 3D</b><span>Gire o sólido com o dedo para contar faces, vértices e arestas.</span></div>
 <div><b>💵 Caixa do mercadinho</b><span>Toque nas notas e moedas para montar o valor ou o troco. Toque na bandeja para tirar.</span></div>
 <div><b>✍️ Escrever</b><span>Escreva seu texto. Ele fica guardado no caderno.</span></div></div></div>

 <div class="hbox"><h2>🪙 6. Moedas ou ⭐ estrelas?</h2><div class="tw"><table><thead><tr><th></th><th>🪙 Moedas</th><th>⭐ Estrelas</th></tr></thead><tbody>
 <tr><td><b>Como ganha</b></td><td>10 por acerto de primeira · 5 na segunda chance · +15 a cada 5 acertos seguidos 🔥 · +150 quando completa 1 hora no mesmo prédio</td><td>1 por terminar a missão · 2 acertando 70% de primeira · 3 acertando 90% de primeira</td></tr>
 <tr><td><b>Para que serve</b></td><td>Comprar coisas para a sua casa e novos personagens 🏠</td><td>Viram <b>Robux de verdade</b> ⬡</td></tr>
 <tr><td><b>Se gastar</b></td><td>Gastar moedas <b>não</b> diminui seus Robux</td><td>Estrelas nunca se perdem</td></tr></tbody></table></div>
 <p>💡 Ficou com 1 ou 2 estrelas? Jogue a missão de novo! Suas estrelas só podem <b>subir</b>, nunca descer.</p></div>

 <div class="hbox rbbox"><h2>⬡ 7. Os Robux</h2><p>Cada estrela vale mais ou menos <b>${Math.round(S.cfg.cap/maxStars())} Robux</b>. Se você conseguir <b>todas as ${maxStars()} estrelas</b>, ganha <b>${S.cfg.cap} Robux</b>!</p>
 <p>Você já tem <b>${totalStars()} estrelas</b> = <b>${robux()} Robux</b>. O papai compra os Robux para você no Roblox.</p></div>

 <div class="hbox"><h2>👾 8. O chefão</h2><ul><li>15 perguntas sorteadas de todas as missões do prédio.</li><li>Você tem <b>3 vidas</b> ❤️❤️❤️ e <b>30 segundos</b> para cada pergunta.</li><li>Perdeu? Tente de novo. Ele vai ficando cansado!</li><li>É a melhor revisão para a <b>manhã da prova</b>.</li></ul></div>

 <div class="hbox"><h2>📒 9. Seu caderno</h2><ul><li><b>📌 Dicas</b>: os cartões que você guardou.</li><li><b>✍️ Meus textos</b>: as cartas, diários e histórias que você escreveu.</li><li><b>🔁 Errei e aprendi</b>: tudo o que você errou, com a resposta certa. Leia antes de dormir!</li></ul></div>

 <div class="hbox"><h2>🏠 10. Sua casa</h2><p>Na loja tem flores, pets, bicicleta, piscina, unicórnio e até um <b>castelo</b> 🏰. Também dá para trocar o seu personagem. Quanto mais coisas, mais a sua casa cresce!</p></div>

 <div class="hbox"><h2>📅 11. Seu plano de estudo</h2><div class="tw"><table><tbody>
 <tr><td><b>Domingo</b></td><td>Português (comece pelas missões 4, 5 e 6) e Ensino Religioso (missões 1, 5 e 6)</td></tr>
 <tr><td><b>Segunda de manhã</b></td><td>Chefão de Português e de Ensino Religioso para revisar</td></tr>
 <tr><td><b>Segunda à noite</b></td><td>Ciências</td></tr><tr><td><b>Terça</b></td><td>História e Geografia</td></tr>
 <tr><td><b>Até 23/11</b></td><td>Matemática, com calma</td></tr></tbody></table></div></div>

 <div class="hbox"><h2>⭐ Dicas de campeã</h2><ul><li>Leia os cartões de dica com atenção: as respostas estão lá.</li><li>Não chute! Pense antes de tocar. Acertar de primeira dá mais estrelas.</li><li>Missões curtinhas todo dia funcionam melhor do que uma maratona.</li><li>O relógio ⏱️ só conta quando você está jogando de verdade.</li></ul></div>
 <div class="row"><button class="btn big" data-act="city">Bora jogar! 🚀</button></div></div>`;scrollTo(0,0);}

/* ---------- área dos pais ---------- */
function parents(){NAV.cur={s:'parents'};R=null;
 if(!pinOK){app.innerHTML=`<div class="page narrow"><h1>Área dos pais</h1><p class="lead">Digite a senha para entrar.</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="Senha"><button class="btn big" id="ok">Entrar</button></div>`;
  const go=()=>{if($('#pin').value===String(S.cfg.pin)){pinOK=true;parents();}else toast('Senha incorreta.');};$('#ok').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go();};return;}
 const rb=robux(),due=Math.max(0,rb-S.cfg.paid),ms=maxStars();
 app.innerHTML=`<div class="page"><h1>Área dos pais</h1>
 <div class="box"><h2>⬡ Robux</h2><p><b>${rb}</b> conquistados de ${S.cfg.cap} · <b>${S.cfg.paid}</b> já entregues · <b>${due}</b> a entregar</p><p class="lead">Regra: Robux = teto × estrelas ÷ total de estrelas possíveis (${totalStars()} de ${ms}). Cada missão vale até 3 estrelas: 1 por concluir, 2 com 70% de acertos de primeira, 3 com 90%. Matérias ainda não publicadas contam como 27 estrelas no total.</p>
 <div><button class="btn" id="paid">Marcar ${due} Robux como entregues</button></div></div>
 ${SHEET?`<div class="box"><h2>👤 ${esc(NOME)}</h2><p class="lead">Para outra pessoa jogar neste aparelho, saia e entre com o PIN dela.</p><div><button class="btn" id="bout">Sair e trocar de pessoa</button></div></div>`:''}
 <div class="box"><h2>Resumo e cópia de segurança</h2><p class="lead">O resumo vai pronto para o WhatsApp. O código de segurança guarda tudo: se um dia o progresso sumir, cole o código aqui e ele volta.</p>
 <div class="row" style="justify-content:flex-start"><button class="btn" id="bres">📤 Enviar resumo</button><button class="btn" id="bbak">💾 Copiar código de segurança</button></div>
 <label for="rcode"><b>Restaurar a partir de um código</b></label><textarea id="rcode" rows="3" placeholder="Cole aqui o código que começa com CIDADE1:"></textarea><div><button class="btn" id="brst">Restaurar</button></div></div>
 <div class="box"><h2>Histórico de missões</h2>${S.live?`<p><b>Agora:</b> ${esc(S.live.nome)} (${esc((SUBJ.find(x=>x.id===S.live.sub)||{}).name||'')}), pergunta ${S.live.pos} de ${S.live.total}, às ${new Date(S.live.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</p>`:''}
 ${(S.log||[]).length?`<div class="tw"><table><thead><tr><th>Quando</th><th>Missão</th><th>Resultado</th><th class="n">Acerto de 1ª</th><th class="n">Erros</th><th class="n">Min</th></tr></thead><tbody>${S.log.slice().reverse().slice(0,60).map(l=>`<tr><td>${new Date(l.at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${esc((SUBJ.find(x=>x.id===l.sub)||{}).e||'')} ${esc(l.nome)}</td><td>${l.res==='concluiu'?'★'.repeat(l.stars||1):esc(l.res)+(l.res==='saiu no meio'?` (${l.feitas}/${l.total})`:'')}</td><td class="n">${l.pct}%</td><td class="n">${l.erros}${l.errou&&l.errou.length?`<details><summary>ver</summary>${l.errou.map(q=>`<div style="text-align:left;font-size:.8rem">• ${esc(q)}</div>`).join('')}</details>`:''}</td><td class="n">${l.min}</td></tr>`).join('')}</tbody></table></div>`:'<p class="lead">Nenhuma missão registrada ainda. Cada missão terminada aparece aqui com o resultado.</p>'}</div>
 <div class="box"><h2>Estudo por matéria</h2><div class="tw"><table><thead><tr><th>Matéria</th><th class="n">Missões</th><th class="n">Estrelas</th><th class="n">Tempo ativo</th><th class="n">Chefão</th></tr></thead><tbody>
 ${SUBJ.map(s=>{const D=DATA[s.id];if(!D)return `<tr><td>${s.name}</td><td colspan="4">em construção</td></tr>`;const [a,b]=subStars(s.id);return `<tr><td>${s.name}</td><td class="n">${D.missions.filter(M=>S.stars[M.id]).length}/${D.missions.length}</td><td class="n">${a}/${b}</td><td class="n">${Math.round((S.time[s.id]||0)/60)} min</td><td class="n">${S.stars['boss-'+s.id]?'★'.repeat(S.stars['boss-'+s.id]):'não'}</td></tr>`;}).join('')}
 </tbody></table></div><p class="lead">Tempo ativo conta só com a tela aberta em dica, missão ou chefão e com toque nos últimos 90 segundos.</p></div>
 <div class="box"><h2>Como funciona (resumo para os pais)</h2><ul class="checks" style="color:var(--ink)">
 <li>• Moedas vêm dos acertos e servem só para a loja do jogo. Estrelas vêm das missões e definem os Robux.</li>
 <li>• Para entregar: compre os Robux "a entregar" no Roblox e toque em "Marcar como entregues".</li>
 <li>• A coluna "Tempo ativo" mostra o estudo real. Cada prédio tem cerca de 100 a 125 minutos de missões.</li>
 <li>• O chefão abre depois de 5 missões e serve como revisão na manhã da prova.</li>
 <li>• "Errei e aprendi", no caderno, lista tudo o que ela errou: bom para revisar junto.</li></ul></div>
 <div class="box"><h2>Ajustes</h2><div class="frm"><label for="cap">Teto de Robux</label><input id="cap" type="number" min="0" step="10" value="${S.cfg.cap}"></div><div class="frm"><label for="pd">Robux já entregues</label><input id="pd" type="number" min="0" value="${S.cfg.paid}"></div><div class="frm"><label for="np">Senha desta área</label><input id="np" type="text" inputmode="numeric" value="${esc(S.cfg.pin)}"></div><div><button class="btn big" id="sv">Salvar ajustes</button></div>
 <p class="lead">${SHEET?'☁️ '+esc(NOME)+': progresso salvo na planilha do papai. Funciona em qualquer aparelho com o mesmo PIN.'+(Cloud.last?' Última gravação: '+new Date(Cloud.last).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.':''):!INCLAUDE?'💾 Progresso salvo neste aparelho e navegador. Use sempre o mesmo aparelho. Para acompanhar de longe, peça o resumo pelo WhatsApp (botão abaixo).':Cloud.on?'☁️ Progresso salvo na nuvem: celular e computador mostram o mesmo jogo.'+(Cloud.last?' Última gravação: '+new Date(Cloud.last).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.':''):'📱 Progresso salvo só neste aparelho. Ele não aparece em outros aparelhos.'}</p></div>
 <div class="box"><h2>Zerar tudo</h2><p class="lead">Apaga moedas, estrelas, caderno e tempo. Não dá para desfazer.</p><div><button class="btn" id="rs">Zerar progresso</button></div></div></div>`;
 if($('#bout'))$('#bout').onclick=async()=>{const b=$('#bout');b.disabled=true;b.textContent='Salvando...';Cloud.dirty=true;try{if(Cloud.on)await Cloud.sheetFlush();}catch(e){}pinOK=false;logout(false);};
 $('#bres').onclick=()=>sendText(resumo(),'Progresso da Olívia');$('#bbak').onclick=()=>sendText(backup(),'Código de segurança');$('#brst').onclick=()=>{const v=$('#rcode').value;if(!v.trim())return toast('Cole o código primeiro.');toast(restore(v)?'Progresso restaurado!':'Código inválido.');};
 $('#paid').onclick=()=>{S.cfg.paid=rb;save();parents();toast('Anotado.');};
 $('#sv').onclick=()=>{S.cfg.cap=Math.max(0,+$('#cap').value||0);S.cfg.paid=Math.max(0,+$('#pd').value||0);S.cfg.pin=$('#np').value.trim()||'2026';S.cfg.t=Date.now();save();hud();parents();toast('Ajustes salvos.');};
 let arm=false;$('#rs').onclick=function(){if(!arm){arm=true;this.textContent='Toque de novo para confirmar';return;}const cfg=S.cfg,ep=(S.epoch||0)+1;S=def();S.cfg=cfg;S.epoch=ep;S.seenHelp=1;save();hud();city();toast('Progresso zerado.');};}

/* ---------- ações ---------- */
let quitT=0;
const ACT={quiz:startQuiz,city,help,report(){sendText(resumo(),'Progresso da Olívia');},sub:subject,play:(s,i)=>startMission(s,+i),review:(s,i)=>lesson(s,+i,0,true),boss:startBoss,house,buy,skin,book,parents,
 sound(){S.sound=!S.sound;localSave();hud();if(S.sound)sfx.coin();},
 quit(){if(Date.now()-quitT<3500){stopTimer();const s=R&&R.sub;if(R&&R.units)logIt('saiu no meio');else S.live=null;save();Cloud.now();s?subject(s):city();}else{quitT=Date.now();toast('Toque de novo no ✕ para sair. As estrelas desta rodada não serão salvas.');}},
 delnote(id){S.notes=S.notes.filter(n=>n.id!==id);save();book('dicas');},deltext(id){S.texts=S.texts.filter(t=>String(t.id)!==id);save();book('textos');},clearwrong(){S.wrong=[];save();book('erros');}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const p=el.dataset.act.split(':');if(ACT[p[0]])ACT[p[0]](p[1],p[2]);});
document.addEventListener('keydown',e=>{if(R&&R.keys&&R.keys[e.key]&&!/INPUT|TEXTAREA/.test(e.target.tagName||'')&&!$('#go')){e.preventDefault();R.keys[e.key]();return;}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.bld[data-act]')){e.preventDefault();e.target.click();}});
let lastIn=Date.now();['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{lastIn=Date.now();},{passive:true}));
setInterval(()=>{if(NAV.cur.s!=='play'&&NAV.cur.s!=='lesson')return;if(document.visibilityState!=='visible'||Date.now()-lastIn>90000)return;const id=NAV.cur.sub;S.time[id]=(S.time[id]||0)+1;
 if(S.time[id]>=3600&&!S.hour[id]){S.hour[id]=1;S.coins+=150;S.earned+=150;toast('🏆 1 hora de estudo neste prédio! +150 moedas');confetti();save();hud();}else if(S.time[id]%20===0){localSave();Cloud.push();}},1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SHEET)Cloud.pull();if(document.visibilityState==='hidden'){clearTimeout(ssT);localSave();if(Cloud.ref){clearTimeout(Cloud.t);Cloud.t=null;Cloud.dirty=true;Cloud.flush();}}});
addEventListener('resize',fitTown);

/* ---------- início ---------- */
if(SHEET&&!PIN){login('');}else{load();applyGrants();hud();if(S.seenHelp)city();else help();}
SUBJ.forEach(s=>{if(DATA[s.id])return;const sc=document.createElement('script');sc.src='data/'+s.id+'.js';sc.onload=()=>{hud();if(NAV.cur.s==='city')city();};sc.onerror=()=>{};document.head.appendChild(sc);});
Cloud.init();Voice.init();Mic.init();setTimeout(banner,12500);setInterval(()=>{if(SHEET){if(PIN&&!Cloud.on&&!Cloud.busy){Cloud.dirty=true;Cloud.flush();}}else if(!Cloud.ref)Cloud.retry();banner();},20000);S.seenAt=Date.now();
window.__oli={resumo,backup,restore,get S(){return S;},get R(){return R;},DATA,est,auto:false,merge,normS};
})();
</script>
</body>
